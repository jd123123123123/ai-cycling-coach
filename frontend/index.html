<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover → content extends under the notch/home-indicator; the app
         reclaims that space with env(safe-area-inset-*). user-scalable=no for a native feel. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Ridr</title>
    <!-- PWA / iPhone "Add to Home Screen" native app behaviour -->
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ridr" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ── FONTS ARE NOT IN FRONT OF THE FIRST FRAME ────────────────────
         A stylesheet in the head blocks the first paint until it arrives, and
         this one is a third-party request. Loaded as `print` and promoted to
         `all` on load, the page paints immediately in the fallback stack and
         swaps when the fonts land — which is what `display=swap` already
         promised and could not deliver while the CSS itself was the thing
         being waited on. The <noscript> copy keeps it working without
         JavaScript.

         The `wght@400..800` range syntax replaces the enumerated list. MEASURED
         2026-08-24: it is NOT a byte saving — Google Fonts returns byte-identical
         CSS for both forms (50 274 B, 123 @font-face rules, discrete static
         instances). It is kept because it is the form that will serve a variable
         file where one is offered, and because the app writes in-between weights
         (560, 590, 620, 650) that only a real axis can render. Today those still
         snap to the nearest static cut. Do not re-derive this: the two URLs were
         fetched and diffed. ── -->
    <!-- ── THE SWITCH TO media="all" HAPPENS IN main.tsx, NOT HERE ────────
         This carried onload="this.media='all'" — the standard async-CSS trick —
         and the app's CSP is a strict `script-src 'self'` with no
         'unsafe-inline' and no 'unsafe-hashes', which blocks inline event
         handlers. So the handler never ran, the sheet stayed media="print"
         forever, and every screen in the app rendered in fallback fonts while
         the CSS sat downloaded and unapplied. The console said so on every
         load: "Executing inline event handler violates ... 'script-src self'".
         The flip is done from the entry bundle instead, which is same-origin
         and therefore allowed. Fonts still never block the first paint. ── -->
    <link
      id="gfonts"
      rel="stylesheet"
      media="print"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=Inter:wght@400..700&family=Inter+Tight:wght@400..800&family=Archivo+Narrow:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Anton&family=Instrument+Serif&family=Archivo:wght@400..800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400..800&family=Inter:wght@400..700&family=Inter+Tight:wght@400..800&family=Archivo+Narrow:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Anton&family=Instrument+Serif&family=Archivo:wght@400..800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- ── THE SHELL SHIPS VISIBLE ────────────────────────────────────────
         #root was empty, so anything that stopped React from mounting — a
         module that throws at import time, a chunk that 404s after a deploy, a
         provider that fails before the error boundary exists — left the user
         staring at the page background. That is the "app starts black and a
         reload fixes it" report: the reload takes a different path and mounts.

         An error boundary cannot help here because it is React, and React is
         the thing that did not start. The only fix that always works is for the
         document itself to carry something. React replaces this the moment it
         mounts, so in the normal case it is one paint of the same mark the app
         uses for every other wait.

         The watchdog below turns the pathological case into a message instead
         of a void: if nothing has replaced this after eight seconds, the boot
         did not happen and the rider is told so, with the one action that
         actually helps. -->
    <div id="root">
      <div id="boot" style="min-height:100dvh;display:grid;place-items:center;background:#0B0B0B;font-family:'Inter Tight',ui-sans-serif,system-ui,sans-serif">
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 32px;text-align:center">
          <div style="width:46px;height:46px;border-radius:14px;background:#BFFF3C"></div>
          <p id="boot-msg" style="margin:0;font-size:13px;font-weight:600;color:#8A9099">Einen Moment…</p>
          <!-- Which build this device is actually running. Readable even though
               nothing has mounted, which is the only moment it matters. -->
          <p style="margin:0;font-size:10px;color:#4A5058;letter-spacing:.04em">__BUILD_STAMP_TEXT__</p>
          <button id="boot-retry" hidden
            style="margin-top:4px;padding:11px 22px;border:0;border-radius:100px;background:#BFFF3C;color:#0B0B0B;font-size:14px;font-weight:600;cursor:pointer">
            Neu laden
          </button>
        </div>
      </div>
    </div>
    <script>
      // Eight seconds is well past a slow cold start on a phone and well short
      // of the rider deciding the app is broken.
      window.setTimeout(function () {
        var boot = document.getElementById('boot')
        if (!boot) return   // React mounted and replaced it — nothing to do
        var msg = document.getElementById('boot-msg')
        var btn = document.getElementById('boot-retry')
        if (msg) msg.textContent = 'Die App konnte nicht starten.'
        if (btn) {
          btn.hidden = false
          btn.onclick = function () { location.reload() }
        }
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
