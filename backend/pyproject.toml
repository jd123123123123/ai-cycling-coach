[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cycling-coach"
version = "0.1.0"
description = "AI-powered cycling coaching backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.10.0",
    "pwdlib[argon2]>=0.2.0",
    "httpx>=0.28.0",
    "numpy>=1.26",
    "cryptography>=42.0",
    "garminconnect>=0.2.0",
    "apscheduler>=3.10,<4.0",
    "anthropic>=0.42.0",
    "fit-tool>=0.9.15",
    "gpxpy>=1.6.0",
    "pywebpush>=2.3.0",
    # WebP transcode for generated collectibles — see services/cyclr_studio._to_data_url
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
